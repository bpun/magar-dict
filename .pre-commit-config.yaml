# Install hooks once per clone:  pre-commit install
# Run on everything:             pre-commit run --all-files
default_language_version:
  python: python3.15

# Global exclusion: This tells ALL hooks to ignore the virtual environment
exclude: '^.venv/'

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Lint and auto-fix with ruff (rules set in pyproject.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]

  # Format with black
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  # Strict type checking. Runs in the project environment so imports resolve.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: mypy
        language: system
        types: [python]
        files: ^(app|scripts)/
        exclude: ^migrations/versions/
        pass_filenames: false
        args: ["app", "scripts", "--ignore-missing-imports"]

  # Block secrets from being committed
  # - repo: https://github.com/gitleaks/gitleaks
