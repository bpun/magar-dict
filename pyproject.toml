[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magar-dict"
version = "0.1.0"
description = "Magar language learning dictionary (Dhut, Kham, Kaike) with AI features"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "redis>=5.0",
    "slowapi>=0.1.9",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.12",
    "rapidfuzz>=3.9",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Heavy ML dependencies are optional so the base install stays light.
# Installed from Day 17 onward.
ai = [
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "playwright>=1.47",
    "ruff>=0.6.9",
    "black>=24.10",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-redis>=4.6",
    "bandit>=1.7.10",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

# ---------------------------------------------------------------------------
# Formatting
# ---------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "migrations/versions/"

# ---------------------------------------------------------------------------
# Linting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear (common bugs)
    "UP",   # pyupgrade (modern syntax)
    "S",    # bandit-style security checks
    "SIM",  # simplifications
    "ASYNC",# async pitfalls
    "N",    # naming
]
ignore = [
    "B008",  # FastAPI Depends() in default arguments is the standard pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # asserts and test fixtures are fine in tests
"migrations/**" = ["N"]
"scripts/**" = ["S603", "S607"]          # scripts may call subprocesses

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/versions/"]

[[tool.mypy.overrides]]
# Third-party libraries without complete type stubs
module = ["faiss.*", "sentence_transformers.*", "gtts.*", "slowapi.*", "rapidfuzz.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "e2e: browser end-to-end tests (slow, run in CI only)",
    "ai: tests that touch the AI layer (mocked by default)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
